services:
  - type: web
    name: recipehub-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: recipehub-api.onrender.com,localhost,127.0.0.1
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://recipehub.onrender.com,https://recipehub-web.onrender.com,https://recipehub-api.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: CORS_ALLOWED_ORIGINS
        value: https://recipehub.onrender.com,https://recipehub-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: PYTHON_VERSION
        value: "3.12"
      - key: WEB_CONCURRENCY
        value: "4"

  - type: static
    name: recipehub-web
    rootDir: .
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://recipehub-api.onrender.com
